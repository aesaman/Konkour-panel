<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><meta name="description" content="داشبورد حرفه‌ای مطالعه کنکور، آفلاین و قابل نصب"><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./style.css"><title>Study OS</title></head><body><div id="app" class="app-shell"><header class="topbar"><div><div id="todayLabel" class="date-label">—</div><div id="viewLabel" class="eyebrow">داشبورد مطالعه</div></div><div class="top-actions"><button class="icon-btn" id="installBtn" hidden title="نصب">＋</button><button class="icon-btn" id="themeHint" title="وضعیت ذخیره‌سازی">●</button></div></header><main id="mainView" class="main"><section class="dashboard-grid"><section class="study-overview panel"><div class="panel-heading"><div><span class="eyebrow">مجموع مطالعه روزانه</span><h1 id="dailyTotal">00:00</h1></div><button class="ghost-btn" id="targetBtn">هدف <span id="targetLabel">10:00</span></button></div><div class="overview-body"><div class="ring-wrap"><svg viewBox="0 0 120 120" class="progress-ring"><circle class="ring-bg" cx="60" cy="60" r="52"></circle><circle id="ringProgress" class="ring-value" cx="60" cy="60" r="52"></circle></svg><div class="ring-center"><strong id="dailyPercent">0%</strong><span>پیشرفت روز</span></div></div><div class="linear-summary"><div class="metric-line"><span id="studiedMetric">00:00 مطالعه شده</span><span id="goalMetric">10:00 هدف</span></div><div class="main-progress"><span id="mainProgressFill"></span></div><div class="metric-line muted"><span id="remainingPercent">100% باقی مانده</span><span id="remainingMetric">10:00 باقی مانده</span></div></div></div></section><section class="sleep-overview panel"><div class="panel-heading"><div><span class="eyebrow">خواب و بیداری</span><h2>ریتم روز</h2></div><button class="ghost-btn" id="sleepBtn">تنظیم</button></div><div id="sleepContent" class="sleep-content empty"><span>هنوز ثبت نشده</span></div></section></section><section class="subjects-section"><div class="section-heading"><div><span class="eyebrow">تمرکز امروز</span><h2>درس‌ها</h2></div><span id="subjectCount" class="count-pill">0 درس</span></div><div id="subjectsList" class="subjects-list"></div><div id="emptySubjects" class="empty-state" hidden><span>هنوز درسی اضافه نشده.</span><button class="text-btn" id="emptyAddSubject">افزودن درس</button></div></section><section id="miniTimer" class="mini-timer" hidden><div class="mini-meta"><span id="miniSubject">—</span><small id="miniActivity">مطالعه</small></div><strong id="miniTime">00:00:00</strong><div class="mini-actions"><button id="miniPause">مکث</button><button id="miniFinish">پایان</button><button id="miniFocus">تمام‌صفحه</button></div></section></main><footer class="bottom-nav"><button data-action="manage"><span>⚙</span><small>مدیریت</small></button><button data-action="history"><span>◷</span><small>تاریخچه</small></button><button data-action="analytics"><span>⌁</span><small>آمار ماهانه</small></button><button data-action="share"><span>↗</span><small>اشتراک‌گذاری</small></button></footer></div><div id="modalRoot"></div><div id="toast" class="toast" role="status"></div><script type="module" src="./app.js"></script></body></html>
